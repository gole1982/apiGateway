proxy_port = 43210
web_port = 43211
refresh_interval_sec = 600

; ── 中心配置同步（代理端，可选）─────────────────────────────
; 配置了 source_url 才启用：启动拉 1 次 + 定时轮询中心版本号，
; 变了就全量重拉并单事务应用；中心不可达沿用本地缓存继续转发（fail-open）。
; 未配置 = 纯本地模式（现状行为，无回归）。
; 详见 docs/superpowers/specs/2026-09-03-center-edge-config-sync-design.md
;
; [sync]
; source_url = https://你的项目.supabase.co/rest/v1/rpc/get_bundle
; version_url = https://你的项目.supabase.co/rest/v1/rpc/get_version
; anon_key = 你的 publishable key（sb_publishable_…，旧称 anon，只读可放代理端）
; center_key =            ; 可选：32字节hex。留空=中心存明文 token（访问安全由 Supabase 负责）；
                          ; 填了=中心存密文，此时管理端与所有代理端必须同一串
; poll_interval_sec = 60

; ── 管理端（可选，只配在你自己电脑上）───────────────────────
; 配了 supabase_url 即管理模式：面板里定义类增删改直写中心，本地仅作运行时
; 镜像（写后立即拉回）。管理机不要再配 [sync]；service_key 用 Supabase secret key
; （sb_secret_…，旧称 service_role），绕过 RLS 可写全表，切勿放进转发机器或提交进仓库。
; 也可在面板「中心配置」页直接录入 URL+key 自动判定角色（推荐），见 docs/初次配置指南.md。
;
; [management]
; supabase_url = https://你的项目.supabase.co
; service_key = 你的 secret key（sb_secret_…）
; center_key = 可选：跟代理端同一串；留空 = 中心存明文 token（推荐，安全由 Supabase 负责）
