version: "3.8"

services:
  gateway:
    # 远程部署时从 GitHub 拉取镜像（CI 自动构建推送）；本地开发可用 docker compose up --build
    image: ghcr.io/gole1982/apiGateway:latest
    build: .
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "13579:13579"   # OpenAI-compatible proxy
      - "24680:24680"   # Web dashboard
    volumes:
      - ./proxy.cfg:/app/proxy.cfg:ro
      - gateway-data:/app/data
      # 兼容旧镜像：旧版本把数据库写到 /app/gateway.db，此文件位于镜像层，
      # 容器重建后会丢失。新版本固定写 /app/data/gateway.db。
    environment:
      - TZ=Asia/Shanghai
      - APIGATEWAY_DATA_DIR=/app/data
    # Health check (proxy endpoint)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13579/status", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  gateway-data:
