# =============================================================================
# apiGateway —— Docker 部署配置模板
# 用法：docker compose 会把本文件只读挂载为容器内的 /app/proxy.cfg。
# 本地 Windows 直运不要用这个文件，用仓库根的 proxy.cfg（端口 43210/43211）。
#
# 端口说明：容器内监听 13579（代理）/ 24680（面板），compose 把它们发布到
# 宿主机同名端口。不要改成 43210/43211 —— compose 的 ports 段与此处必须一致。
# =============================================================================
proxy_port = 13579
web_port = 24680
refresh_interval_sec = 600

# —— 中心配置同步（代理端，可选）——
# 配置 source_url 才启用：启动拉 1 次 + 定时轮询中心版本号，
# 变了就全量重拉并单事务应用；中心不可达沿用本地缓存继续转发（fail-open）。
# 未配置 = 纯本地模式。
#
# [sync]
# source_url = https://你的项目.supabase.co/rest/v1/rpc/get_bundle
# version_url = https://你的项目.supabase.co/rest/v1/rpc/get_version
# anon_key = <sb_publishable_…，只读，可放代理端>
# center_key = <可选：32字节hex；留空 = 中心存明文 token>
# poll_interval_sec = 60

# —— 管理端（可选，只配在你自己的管理机）——
# [management]
# supabase_url = https://你的项目.supabase.co
# service_key = <sb_secret_…，可写全表；切勿提交进仓库>
# center_key = <留空 = 中心存明文；填了则与所有代理端一致>

# —— 主密钥（生产必须）——
# 容器内 ~/.apiGateway.key 随容器重建丢失 → 历史密文解不开。
# 生产必须用环境变量注入固定 key（64 位 hex），compose 已透传 APIGATEWAY_KEY，
# 在 .env 或 shell 里设置：APIGATEWAY_KEY=<64位hex>。
# 没有它，容器重建后 settings.sb_api_key 与平台 token 全部无法解密。
