name: CI

# 触发：
#  - 针对 master/main 的 push（含合并）
#  - 所有 pull request
#  - 手动触发（workflow_dispatch，便于重新跑）
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: 校验 —— 单元测试 + go vet + 编译。这是合入门槛。
  # ===========================================================================
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true


      - name: go vet
        run: go vet ./...

      # 说明：本项目是单进程 SQLite（modernc.org/sqlite），且既有代码可能存在
      # 状态层面的并发依赖（FSM / 调度器）。`-race` 可能让第一版 CI 暴露既有
      # 竞态而一直红。先以普通测试 + vet 作为合入门槛，竞态问题收敛后再启用
      # `-race`（见下方向第三阶段）。
      - name: Unit tests
        run: go test ./... -count=1

      - name: Build (linux)
        run: CGO_ENABLED=0 go build -o bin/gateway-linux ./cmd/gateway

      - name: Build diaglog
        run: CGO_ENABLED=0 go build -o bin/diaglog-linux ./cmd/diaglog

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gateway-binaries
          path: bin/
          if-no-files-found: warn

  # ===========================================================================
  # Job 2: 覆盖率门禁 —— 每个有测试的包不得低于地板线。
  # 地板线 = 2026-09-26 实测值向下取整（内联在下面的 floors 表）。
  # 加未测代码会拉低百分比 → CI 红 → 补测试或（有理由时）下调地板线。
  # 这是对"全绿但漏 bug"的回答：绿必须附带覆盖率。
  # ===========================================================================
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Coverage floors
        run: |
          go test ./... -cover > cover.txt 2>&1 || { cat cover.txt; exit 1; }
          cat cover.txt
          python3 - <<'EOF'
          import re, sys
          floors = {
              "gateway/internal/apiformat": 34,
              "gateway/internal/bundle": 76,
              "gateway/internal/config": 62,
              "gateway/internal/crypto": 68,
              "gateway/internal/db": 65,
              "gateway/internal/entity": 95,
              "gateway/internal/fsm": 92,
              "gateway/internal/gateway": 10,
              "gateway/internal/logger": 32,
              "gateway/internal/notify": 49,
              "gateway/internal/scheduler": 71,
              "gateway/internal/service": 5,
              "gateway/internal/supabase": 44,
          }
          seen, failed = set(), False
          for line in open("cover.txt", encoding="utf-8", errors="replace"):
              m = re.search(r"^(ok\s+)?(\S+)\s+.*coverage: ([0-9.]+)%", line)
              if not m:
                  continue
              pkg, pct = m.group(2), float(m.group(3))
              if pkg not in floors:
                  continue
              seen.add(pkg)
              status = "OK " if pct >= floors[pkg] else "FAIL"
              if pct < floors[pkg]:
                  failed = True
              print(f"{status} {pkg}: {pct}% (floor {floors[pkg]}%)")
          missing = set(floors) - seen
          if missing:
              print(f"FAIL no coverage reported for: {sorted(missing)}")
              failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload coverage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-log
          path: cover.txt
          if-no-files-found: warn

  # ===========================================================================
  # Job 3: gofmt —— 只检查本分支改动过的 Go 文件（仓库有历史 CRLF 漂移，
  # 全量 gofmt -l 会误伤存量文件，所以限定 diff 范围）。
  # ===========================================================================
  gofmt:
    name: gofmt (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gofmt changed Go files
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          files=$(git diff --name-only "$BASE" HEAD -- '*.go')
          files="$files $(git ls-files --others --exclude-standard -- '*.go')"
          files=$(echo "$files" | sed '/^$/d' | sort -u)
          if [ -z "$files" ]; then echo "no Go files changed"; exit 0; fi
          echo "checking:"; echo "$files"
          # shellcheck disable=SC2086
          bad=$(gofmt -l $files)
          if [ -n "$bad" ]; then echo "NOT FORMATTED:"; echo "$bad"; exit 1; fi
          echo "gofmt clean"

  # ===========================================================================
  # Job 4: 静态分析 (golangci-lint)
  #
  # 说明：本仓库 .golangci.yml 启用了较严格的 linter 集合（gosec / staticcheck
  # / lll / gocyclo 等）。为让 CI 先稳定跑起来，此 job 当前【允许失败】——
  # 先让它给出报告，回头收敛问题、再由 has_* 输出改为阻断。
  #   has_errors 也可以通过到时再把 continue-on-error 移除。
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true   # TODO: 待存量问题清零后移除
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # 固定版本而非 latest：latest 会随时间漂移，且 .golangci.yml 的
      # depguard 规则块是旧格式（rules ->），新版本已改名为 linters。先固定到
      # v1.60 稳妥跑通，后续需要再升。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=5m

  # ===========================================================================
  # Job 5: 发版 —— push tag（v*）时交叉编译各平台二进制并建 GitHub Release。
  # CGO_ENABLED=0（modernc sqlite 是纯 Go），无需交叉工具链。
  # ===========================================================================
  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Cross-compile
        run: |
          mkdir -p dist
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then continue; fi
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              for app in gateway diaglog; do
                echo "building $app $os/$arch"
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                  go build -ldflags="-s -w" -o dist/${app}-${os}-${arch}${ext} ./cmd/$app
              done
            done
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # ===========================================================================
  # Job 6: Docker 镜像构建
  # ===========================================================================
  docker:
    name: Docker image
    needs: [test]
    runs-on: ubuntu-latest
    # 仅 push 到主分支 / push tag 时构建镜像（PR 阶段不做镜像，节省时间）
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名必须全小写：Docker 拒绝含大写字母的 repository name
      # （本仓库 apiGateway → apigateway）。metadata-action 不会自动小写化，
      # 故先算出小写名再喂给它。docker-compose.yml 里写死同一个名字。
      - name: Resolve image name (lowercase)
        id: imgn
        run: echo "name=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.imgn.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
            # 主分支固定 tag，便于部署引用
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max