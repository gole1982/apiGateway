name: CI

# 触发：
#  - 针对 master/main 的 push（含合并）
#  - v* tag 的 push（发版：release job 只认 refs/tags/v*，不加这行它永不执行 ——
#    v0.1.20260928 已经验证过一次：tag 推上去了，workflow 一次没跑）
#  - 所有 pull request
#  - 手动触发（workflow_dispatch，便于重新跑）
on:
  push:
    branches: [master, main]
    tags: ['v*']
    # 纯文档/元数据改动不触发任何 job（含 docker 镜像重建）。
    # 注意：GitHub 不对 tag push 评估 paths 过滤，故手动推 v* tag 仍照常发版。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.dockerignore'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Job 1: 校验 —— 单元测试 + go vet + 编译。这是合入门槛。
  # ===========================================================================
  test:
    name: Test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true


      - name: go vet
        run: go vet ./...

      # 说明：本项目是单进程 SQLite（modernc.org/sqlite），且既有代码可能存在
      # 状态层面的并发依赖（FSM / 调度器）。`-race` 可能让第一版 CI 暴露既有
      # 竞态而一直红。先以普通测试 + vet 作为合入门槛，竞态问题收敛后再启用
      # `-race`（见下方向第三阶段）。
      - name: Unit tests
        run: go test ./... -count=1

      - name: Build (linux)
        run: CGO_ENABLED=0 go build -o bin/gateway-linux ./cmd/gateway

      - name: Build diaglog
        run: CGO_ENABLED=0 go build -o bin/diaglog-linux ./cmd/diaglog

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gateway-binaries
          path: bin/
          if-no-files-found: warn

  # ===========================================================================
  # Job 2: 覆盖率门禁 —— 每个有测试的包不得低于地板线。
  # 地板线 = 2026-09-26 实测值向下取整（内联在下面的 floors 表）。
  # 加未测代码会拉低百分比 → CI 红 → 补测试或（有理由时）下调地板线。
  # 这是对"全绿但漏 bug"的回答：绿必须附带覆盖率。
  # ===========================================================================
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Coverage floors
        # 地板线基准 = **CI 首次实跑**（ubuntu-latest）的实测值，不是本地值。
        # 两者会差好几个点（config 本地 Windows 62.5% vs CI linux 57.1%）——
        # 拿本地数字设阈值必然误报。
        #
        # 每条向下留 2~4 个点缓冲：贴着实测值设会在"改了一行无关代码"时变红，
        # 而红的原因与真实退化无关，这会训练团队忽略这个 job。
        # 提升覆盖率时请同步上调；重跑 CI 看实测再定，不要凭本地推断。
        run: |
          go test ./... -cover > cover.txt 2>&1 || { cat cover.txt; exit 1; }
          cat cover.txt
          python3 - <<'EOF'
          import re, sys
          floors = {
              "gateway/internal/apiformat": 30,
              "gateway/internal/bundle": 70,
              "gateway/internal/config": 55,
              "gateway/internal/crypto": 64,
              "gateway/internal/db": 60,
              "gateway/internal/entity": 88,
              "gateway/internal/fsm": 88,
              "gateway/internal/gateway": 10,
              "gateway/internal/logger": 28,
              "gateway/internal/notify": 42,
              "gateway/internal/scheduler": 64,
              "gateway/internal/service": 5,
              "gateway/internal/supabase": 40,
          }
          seen, failed = set(), False
          for line in open("cover.txt", encoding="utf-8", errors="replace"):
              m = re.search(r"^(ok\s+)?(\S+)\s+.*coverage: ([0-9.]+)%", line)
              if not m:
                  continue
              pkg, pct = m.group(2), float(m.group(3))
              if pkg not in floors:
                  continue
              seen.add(pkg)
              status = "OK " if pct >= floors[pkg] else "FAIL"
              if pct < floors[pkg]:
                  failed = True
              print(f"{status} {pkg}: {pct}% (floor {floors[pkg]}%)")
          missing = set(floors) - seen
          if missing:
              print(f"FAIL no coverage reported for: {sorted(missing)}")
              failed = True
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload coverage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-log
          path: cover.txt
          if-no-files-found: warn

  # ===========================================================================
  # Job 3: gofmt —— 只检查本分支改动过的 Go 文件（仓库有历史 CRLF 漂移，
  # 全量 gofmt -l 会误伤存量文件，所以限定 diff 范围）。
  # ===========================================================================
  gofmt:
    name: gofmt (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gofmt changed Go files
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD~1"
          fi
          # git 自身失败必须继续让 job 变红 —— 只有最后的 while-read
          # 需要容忍（见下）。所以分开写，不把 || true 套在 git 外面。
          diff_list=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- '*.go')
          untracked=$(git ls-files --others --exclude-standard -- '*.go')
          # 只保留 HEAD 里仍存在的文件：--diff-filter=d 已排除删除，
          # 这里再挡一次未跟踪文件里指向已删路径的情况。
          #
          # 末尾的 || true 只接 while-read 的 EOF：输入耗尽时它返回非零，
          # bash -e 会直接杀掉整个 step 且不打印任何东西。"no Go files
          # changed" 这条分支在纯 YAML/文档 PR 之前一次都没走过 —— 之前
          # 所有跑通的 run 恰好都有 Go 文件变更，空列表路径从未被执行。
          files=$(printf '%s\n%s\n' "$diff_list" "$untracked" | sed '/^$/d' | sort -u | while read -r f; do
            [ -f "$f" ] && echo "$f"
          done || true)
          if [ -z "$files" ]; then echo "no Go files changed"; exit 0; fi
          echo "checking:"; echo "$files"
          # shellcheck disable=SC2086
          bad=$(gofmt -l $files)
          if [ -n "$bad" ]; then echo "NOT FORMATTED:"; echo "$bad"; exit 1; fi
          echo "gofmt clean"

  # ===========================================================================
  # Job 4: 静态分析 (golangci-lint)
  #
  # 说明：本仓库 .golangci.yml 启用了较严格的 linter 集合（gosec / staticcheck
  # / lll / gocyclo 等）。为让 CI 先稳定跑起来，此 job 当前【允许失败】——
  # 先让它给出报告，回头收敛问题、再由 has_* 输出改为阻断。
  #   has_errors 也可以通过到时再把 continue-on-error 移除。
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true   # TODO: 待存量问题清零后移除
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      # 固定版本而非 latest：latest 会随时间漂移，且 .golangci.yml 的
      # depguard 规则块是旧格式（rules ->），新版本已改名为 linters。先固定到
      # v1.60 稳妥跑通，后续需要再升。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=5m

  # ===========================================================================
  # Job 6: 自动版本标签 —— 每次 master 构建自动打「<大>.<小>.<YYYYMMDD>」tag。
  #
  #   大版本：显式指定，写在仓库根 VERSION 文件里（如 1）。
  #   小版本：大版本相对上一次发布变了 → 归零；没变 → 上一次 +1。
  #   日期  ：Asia/Shanghai 当天，yyyymmdd。
  #
  # 例：VERSION=1，已有 v1.1.20260930 → 下次 v1.2.20260930；
  #     把 VERSION 改成 2       → v2.0.20260930，再下次 v2.1.20260930。
  #
  # 上一次发布从远端 tag 推导（不依赖本地状态），故同日多次推送小版本自然
  # 递增，无需额外后缀。
  #
  # 关键约束：本 job 用 GITHUB_TOKEN 创建的 tag **不会**再触发一次 workflow
  # （GitHub 防递归，官方明确行为）。所以不能指望"打完 tag 让 release job
  # 被 tag 事件拉起"，必须把 tag 名经 outputs 传给同一次运行内的 job。
  # ===========================================================================
  tag:
    name: Auto tag
    needs: [test, coverage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute and push tag
        id: ver
        run: |
          set -euo pipefail

          MAJOR=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s' "$MAJOR" | grep -Eq '^[0-9]+$'; then
            echo "VERSION 内容非法：'$MAJOR'（只写大版本号，如 1 或 2）" >&2
            exit 1
          fi

          git fetch --tags --force origin

          # 重跑同一个 commit 时复用已有 tag，否则会凭空多出一个版本号。
          head_tag=$(git tag --points-at HEAD \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]{8}$' | sort -V | tail -1 || true)
          if [ -n "$head_tag" ]; then
            echo "HEAD 已打 $head_tag，复用（判定为重跑）"
            echo "version=${head_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 上一次发布：远端所有 v<大>.<小>.<日期> 里，大版本最大、其次小版本最大者。
          latest=$(git ls-remote --tags origin 'refs/tags/v*' \
            | sed 's#.*refs/tags/##; s/\^{}$//' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]{8}$' \
            | sed 's/^v//' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 || true)

          if [ -n "$latest" ]; then
            last_major=${latest%%.*}
            last_minor=$(printf '%s' "$latest" | cut -d. -f2)
          else
            last_major=""
            last_minor=-1
          fi

          # 大版本变了 → 小版本归零；否则在上一次基础上 +1。
          if [ "$last_major" = "$MAJOR" ]; then
            MINOR=$((last_minor + 1))
          else
            MINOR=0
          fi

          TAG="v${MAJOR}.${MINOR}.$(TZ=Asia/Shanghai date +%Y%m%d)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/${TAG}"

          echo "tagged: $TAG（上一次发布：${latest:-无}）"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Job 7: 发版 —— 手动推 v* tag 时交叉编译各平台二进制并建 GitHub Release。
  # CGO_ENABLED=0（modernc sqlite 是纯 Go），无需交叉工具链。
  #
  # 两种来源：a) 手动 `git push origin v1.1.20260928`（tag 事件）；
  #          b) 自动 tag job 的产物（同一运行内传 outputs，见 job 6）。
  # ===========================================================================
  release:
    name: Release binaries
    needs: [test, coverage, tag]
    # tag job 在 tag 事件 / PR 上会被跳过，此处需容忍其 skipped 状态。
    if: |
      always() && !cancelled() && !failure()
      && (startsWith(github.ref, 'refs/tags/v') || needs.tag.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.version && format('v{0}', needs.tag.outputs.version) || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Cross-compile
        run: |
          mkdir -p dist
          for os in linux windows darwin; do
            for arch in amd64 arm64; do
              if [ "$os" = "windows" ] && [ "$arch" = "arm64" ]; then continue; fi
              ext=""; [ "$os" = "windows" ] && ext=".exe"
              for app in gateway diaglog; do
                echo "building $app $os/$arch"
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch \
                  go build -ldflags="-s -w" -o dist/${app}-${os}-${arch}${ext} ./cmd/$app
              done
            done
          done
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.version && format('v{0}', needs.tag.outputs.version) || github.ref_name }}
          files: dist/*
          generate_release_notes: true

  # ===========================================================================
  # Job 8: Docker 镜像构建
  # ===========================================================================
  docker:
    name: Docker image
    needs: [test, tag]
    runs-on: ubuntu-latest
    # GHCR 推送要 packages: write。缺了就是这次的样子：
    # "denied: installation not allowed to Create organization package"。
    # 构建本身能过、push 那一步才挂 —— 首跑之前没人知道。
    permissions:
      contents: read
      packages: write
    # 仅 push 到主分支 / push tag 时构建镜像（PR 阶段不做镜像，节省时间）。
    # 注意 tag job 在 tag 事件上是 skipped —— 被 need 的 job 一旦 skipped，
    # 依赖它的 job 默认也会 skipped，故这里必须用 always() 兜住，
    # 再用 !failure() 保证上游真的失败时仍然不跑。
    if: |
      always() && !cancelled() && !failure()
      && github.event_name == 'push'
      && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像名必须全小写：Docker 拒绝含大写字母的 repository name
      # （本仓库 apiGateway → apigateway，owner 同理）。metadata-action
      # 不会自动小写化，故 owner 和仓库名都先算出小写再喂给它。
      # docker-compose.yml 里写死同一个名字。
      - name: Resolve image name (lowercase)
        id: imgn
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "name=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.imgn.outputs.owner }}/${{ steps.imgn.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
            # 主分支固定 tag，便于部署引用
            type=raw,value=latest,enable={{is_default_branch}}
            # 自动版本号（来自 tag job 的 VERSION+日期），与 Release 同名
            type=raw,value=${{ needs.tag.outputs.version }},enable=${{ needs.tag.result == 'success' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max